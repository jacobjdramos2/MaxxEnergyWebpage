<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Data Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        .content {
            background-color: white;
            padding: 20px;
            display: inline-block;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        .logout-button {
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
        }

        .logout-button:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>
<div class="content">
    <h1>Welcome to the Data Page!</h1>
    <p>You have successfully logged in.</p>

    <h2>Maxx Energy Sales Data</h2>
    <table>
        <tr>
            <th>Date</th>
            <th>Product</th>
            <th>Units Sold</th>
            <th>Total Revenue ($)</th>
        </tr>
        <tr>
            <td>2025-08-10</td>
            <td>Solar Panel X100</td>
            <td>45</td>
            <td>13,500</td>
        </tr>
        <tr>
            <td>2025-08-09</td>
            <td>Battery Storage B500</td>
            <td>30</td>
            <td>9,000</td>
        </tr>
        <tr>
            <td>2025-08-08</td>
            <td>Wind Turbine T20</td>
            <td>10</td>
            <td>25,000</td>
        </tr>
    </table>

    <a href="/" class="logout-button">Log Out</a>
</div>
</body>
</html>
